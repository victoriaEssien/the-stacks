<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#14100c" />
    <!-- Installed to a home screen, it launches without browser chrome. The
         `apple-` prefixed pair is still what iOS reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Stacks" />
    <meta name="description" content="A personal 3D library that grows with every book I finish." />
    <title>The Stacks</title>

    <!-- Link previews. Without these a shared link renders as a bare URL, or at
         best a line of grey text, which is a poor showing for a project whose
         whole point is that it looks like a room.

         `og:url` and `og:image` must be ABSOLUTE - a crawler has no page to
         resolve a relative path against - so they name the production domain.
         A preview deployment therefore advertises production's card, which is
         the right trade: previews are not shared.

         `og-cover.jpg` is rendered from the real room with headless Chrome, the
         same way the app icons are, and it is stocked with the PLACEHOLDER
         books from `src/data/seed.ts`. That is deliberate and it is why the
         app's own header is hidden in the shot: the header carries a "books
         read" count, and putting a placeholder count on a card about someone's
         real reading would be a lie. See CLAUDE.md for how to redraw it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Stacks" />
    <meta property="og:title" content="The Stacks" />
    <meta
      property="og:description"
      content="A personal 3D library that grows with every book I finish."
    />
    <meta property="og:url" content="https://stacks.vessien.com/" />
    <meta property="og:image" content="https://stacks.vessien.com/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Shelves of books in a warmly lit reading room, seen from the floor of a 3D library."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Stacks" />
    <meta
      name="twitter:description"
      content="A personal 3D library that grows with every book I finish."
    />
    <meta name="twitter:image" content="https://stacks.vessien.com/og-cover.jpg" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
