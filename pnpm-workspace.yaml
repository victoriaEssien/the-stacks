# false on purpose. core-js only ships a postinstall that prints a funding
# banner, and it works fine without it. Answered explicitly rather than left
# unanswered, because pnpm exits non-zero on an undecided build script and that
# blocks every other script in the repo.
allowBuilds:
  core-js: false
# pnpm 11 holds back very fresh releases by default; these were current when
# the project was scaffolded and are allowed through explicitly.
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.69.0'
  - '@typescript-eslint/parser@8.69.0'
  - '@typescript-eslint/project-service@8.69.0'
  - '@typescript-eslint/scope-manager@8.69.0'
  - '@typescript-eslint/tsconfig-utils@8.69.0'
  - '@typescript-eslint/type-utils@8.69.0'
  - '@typescript-eslint/types@8.69.0'
  - '@typescript-eslint/typescript-estree@8.69.0'
  - '@typescript-eslint/utils@8.69.0'
  - '@typescript-eslint/visitor-keys@8.69.0'
  - typescript-eslint@8.69.0
